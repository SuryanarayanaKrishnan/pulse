# Production stack for a single Oracle Cloud Always Free VM (ARM A1 or the AMD micro).
# Run from /opt/pulse/deploy/oci:  docker compose -f docker-compose.prod.yml --env-file /opt/pulse/.env up -d --build
name: pulse
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in /opt/pulse/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_DB: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by deploy.sh}
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--maxmemory", "128mb"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build: {context: ../.., dockerfile: Dockerfile}
    command: ["alembic", "upgrade", "head"]
    env_file: /opt/pulse/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse
      DB_PGBOUNCER: "false"
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build: {context: ../.., dockerfile: Dockerfile}
    restart: unless-stopped
    env_file: /opt/pulse/.env
    environment: &env
      APP_ENV: production
      LOG_JSON: "true"
      QUEUE_BACKEND: arq
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse
      DB_PGBOUNCER: "false"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_DIR: /data/storage
    volumes: [storage:/data/storage]
    mem_limit: 1g
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    build: {context: ../.., dockerfile: Dockerfile}
    restart: unless-stopped
    command: ["arq", "app.workers.settings.WorkerSettings"]
    env_file: /opt/pulse/.env
    environment: *env
    volumes: [storage:/data/storage]
    mem_limit: 1g
    # The image's HEALTHCHECK probes the API's HTTP port, which the arq worker does not serve.
    healthcheck:
      disable: true
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  pgdata:
  storage:

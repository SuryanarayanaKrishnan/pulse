[project]
name = "pulse-api"
version = "0.1.0"
description = "Backend API for a UAE personal-finance app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "arq>=0.26",
  "structlog>=24.1",
  "pyjwt[crypto]>=2.8",
  "cryptography>=42",
  "httpx>=0.27",
  "email-validator>=2.1",
  "pikepdf>=10.18.2",
  "pdfplumber>=0.11.11",
  "rapidfuzz>=3.14.6",
  "python-multipart>=0.0.34",
  "boto3>=1.44.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S603", "E501"]
# Stdlib-only CLI tools that fetch public pages; sha1 is only a filename key, not security.
"scripts/*" = ["E501", "S310", "S324"]
# Regex templates read better on one line each.
"app/services/parsers/sms/*" = ["E501"]
"app/services/parsers/statements/*" = ["E501"]
"app/services/merchants.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pdfplumber.*", "pikepdf.*"]
ignore_missing_imports = true
